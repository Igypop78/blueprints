blueprint:
  name: Kúrenie – prikúrenie izieb pri štarte kotla
  description: >-
    Keď sa zapne kotol, krátko zvýši cieľovú teplotu všetkých zapnutých termostatov
    (režim heat) a hneď ju vráti späť. Termostaty (napr. generic_thermostat), ktorým
    chýba do cieľa len kúsok, sa tak zapnú spolu s ostatnými a dokúria sa naraz – kotol
    potom zbytočne necykluje kvôli jednej izbe. Vypnuté termostaty preskočí, pôvodné
    teploty si zapamätá a vráti presne tie.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  author: Igypop78
  source_url: https://github.com/Igypop78/blueprints/blob/main/automation/kurenie_prikurenie_pri_starte_kotla.yaml
  input:
    kotol:
      name: Kotol
      description: Spínač kotla (switch / input_boolean)
      selector:
        entity:
          filter:
            - domain:
                - switch
                - input_boolean
    termostaty:
      name: Termostaty
      description: Termostaty izieb, ktoré sa majú prikúriť
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate
    zvysenie:
      name: Zvýšenie cieľovej teploty
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1
          unit_of_measurement: °C
          mode: slider
    oneskorenie:
      name: Počkať po zapnutí kotla
      description: Kým sa ustália stavy termostatov
      default:
        seconds: 10
      selector:
        duration: {}
    drzanie:
      name: Ako dlho držať zvýšenú teplotu
      description: Stačí pár sekúnd – termostat sa zapne a kúri až do cieľa
      default:
        seconds: 5
      selector:
        duration: {}

variables:
  vstup_termostaty: !input termostaty
  zvysenie: !input zvysenie

triggers:
  - trigger: state
    entity_id: !input kotol
    from: "off"
    to: "on"

actions:
  - delay: !input oneskorenie
  # zapamätať pôvodné teploty len zapnutých termostatov
  - variables:
      povodne: >-
        {% set ids = [vstup_termostaty] if vstup_termostaty is string else vstup_termostaty %}
        {% set ns = namespace(out=[]) %}
        {% for e in ids if is_state(e, 'heat') and state_attr(e, 'temperature') is number %}
          {% set ns.out = ns.out + [{'e': e, 't': state_attr(e, 'temperature')}] %}
        {% endfor %}
        {{ ns.out }}
  - condition: template
    value_template: "{{ povodne | count > 0 }}"
  - repeat:
      for_each: "{{ povodne }}"
      sequence:
        - action: climate.set_temperature
          target:
            entity_id: "{{ repeat.item.e }}"
          data:
            temperature: "{{ (repeat.item.t + zvysenie | float(0.5)) | round(1) }}"
  - delay: !input drzanie
  - repeat:
      for_each: "{{ povodne }}"
      sequence:
        - action: climate.set_temperature
          target:
            entity_id: "{{ repeat.item.e }}"
          data:
            temperature: "{{ repeat.item.t }}"
mode: single
